name: Sonda das fontes

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/sonda.mjs"]

permissions:
  contents: read

jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: node scripts/sonda.mjs
